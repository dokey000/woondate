<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 휴대폰</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
      font-family: sans-serif;
    }
    .phone {
      width: 320px;
      height: 620px;
      border-radius: 36px;
      background: linear-gradient(160deg, #6a85f1, #b06ab3);
      padding: 24px 16px;
      box-sizing: border-box;
      color: white;
      box-shadow: 0 0 0 8px #000;
    }
    .clock { text-align: center; margin: 30px 0 40px; }
    .clock .time { font-size: 56px; font-weight: 300; }
    .clock .date { font-size: 14px; opacity: 0.85; }
    .apps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 8px;
    }
    .app { text-align: center; cursor: pointer; font-size: 12px; }
    .app .icon {
      width: 56px; height: 56px;
      margin: 0 auto 6px;
      border-radius: 14px;
      background: rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .app:active .icon { transform: scale(0.9); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="clock">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date"></div>
    </div>

    <div class="apps">
      <div class="app" onclick="openApp('사진첩')"><div class="icon">🖼️</div>사진</div>
      <div class="app" onclick="openApp('메모')"><div class="icon">📝</div>메모</div>
      <div class="app" onclick="openApp('음악')"><div class="icon">🎵</div>음악</div>
      <div class="app" onclick="openApp('연락처')"><div class="icon">📞</div>연락처</div>
    </div>
  </div>

  <script>
    // 시계: 1초마다 현재 시간 갱신
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent =
        now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('date').textContent =
        now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 앱 아이콘을 누르면 실행되는 함수 (여기를 원하는 내용으로 바꾸세요)
    function openApp(name) {
      alert(name + ' 앱을 열었어요!');
    }
  </script>
</body>
</html>
